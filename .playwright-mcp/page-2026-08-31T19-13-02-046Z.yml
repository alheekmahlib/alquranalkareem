          - generic [ref=e59]:
            - paragraph [ref=e60]: تطبيق سورة هو نسخة رقمية من المصحف الشريف، لتيسير القراءة والاستماع والحفظ وفهم معاني الكلمات، عبر واجهة بسيطة وواضحة تناسب الاستخدام اليومي.يتيح التطبيق لمستخدميه عدة ميزات منها:- قراءة القرآن الكريم كاملًا والتنقل بين السور والأجزاء والآيات بسهولة.- البحث الذكي داخل التطبيق عن الكلمات ومتشابهات القرآن الكريم، موضحًا اسم السورة ورقم الآية والصفحة، والانتقال إليها.- التفسير الميسر ومعاني الكلمات بمجرد الضغط عليها في أثناء القراءة، وترجمتها باللغة الإنجليزية.- إعراب كلمات القرآن، وتصريفها، واختلاف القراءات لنفس الكلمة إن وُجدت، تظهر عند الضغط على الكلمة في أثناء القراءة.- الاستماع للقرآن الكريم مرتلًا أو مجودًا بواسطة أكثر من 60 من القراء المعروفين.- إمكانية إعادة الاستماع للآيات أكثر من مرة لتيسير الحفظ والتلقين.- كتابة تعليقات ووضع فواصل في أثناء القراءة للرجوع إليها لاحقًا.بالإضافة لذلك يقدم تطبيق سورة أدوات للحفظ والاختبار الذاتي، مثل إنشاء خطط شخصية للحفظ، مع تذكيرات ذكية، وخاصية للاختبار الذاتي لتتبع التقدم والمراجعة اليومية.
