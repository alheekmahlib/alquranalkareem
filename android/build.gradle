ext {
    compileSdkVersion = 37
    targetSdkVersion = 37
    appCompatVersion = "1.4.2"
}

buildscript {
    ext.kotlin_version = '2.2.0'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath 'com.android.tools.build:gradle:8.13.2'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven {
            url "${project(':background_fetch').projectDir}/libs"
        }
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

// Force every subproject (including Flutter plugins like home_widget, whose own
// build.gradle pins jvmTarget = "1.8") to compile Kotlin/Java against JVM 17.
// This fixes: "Cannot inline bytecode built with JVM target 11 into bytecode
// that is being built with JVM target 1.8."
subprojects {
    // `:app` is already evaluated due to evaluationDependsOn(':app') above,
    // so configure it immediately; others via afterEvaluate.
    if (project.state.executed) {
        configureJvm17(project)
    } else {
        afterEvaluate { configureJvm17(project) }
    }
}

void configureJvm17(Project project) {
    if (project.hasProperty('android')) {
        project.android {
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
            // kotlinOptions is a DSL method inside the android block, added by
            // the kotlin-android plugin. Only invoke it when that plugin is applied.
            if (project.plugins.hasPlugin('kotlin-android')) {
                kotlinOptions {
                    jvmTarget = '17'
                }
            }
        }
    }
}

// Exclude problematic alpha deps and force stable versions
subprojects {
    configurations.all {
        resolutionStrategy {
            force 'androidx.glance:glance-appwidget:1.1.1'
        }
        exclude group: 'androidx.compose.remote', module: 'remote-creation-android'
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
