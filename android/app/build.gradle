plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.alheekmah.alquranalkareem.alquranalkareem"
    compileSdkVersion 37
    ndkVersion flutter.ndkVersion

    defaultConfig {
        multiDexEnabled true
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    // Ensure Kotlin uses JDK 17 toolchain
    kotlin {
        jvmToolchain(17)
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    // flutter_onnxruntime pulls libonnxruntime.so twice: via its Maven AAR
    // (onnxruntime-android) and via sherpa_onnx prebuilt jniLibs. Pick one copy.
    packaging {
        jniLibs {
            pickFirsts += ['lib/**/libonnxruntime.so']
        }
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "com.alheekmah.alquranalkareem.alquranalkareem"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdkVersion 24
        targetSdkVersion 37
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile file(keystoreProperties['storeFile'])
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }
}

// Both copies of libonnxruntime.so must be the SAME version: sherpa_onnx's
// prebuilt jniLibs and libonnxruntime4j_jni.so (from the Maven AAR) resolve
// OrtGetApiBase against strictly versioned symbols, so a 1.23.0/1.24.3 mix
// fails dlopen at startup and aborts plugin registration. sherpa_onnx 1.12.40
// bundles onnxruntime 1.24.3 — force the Maven dep to match. Revisit this
// version whenever sherpa_onnx is upgraded.
configurations.all {
    resolutionStrategy {
        force 'com.microsoft.onnxruntime:onnxruntime-android:1.24.3'
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation 'com.google.android.material:material:1.6.1'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:1.2.2'
}
