name: Release — Mac App Store (TestFlight)

# Manual-trigger workflow: builds a Mac App Store .pkg (Apple Distribution
# signing + embedded MAS profiles + Mac Installer Distribution pkg signature)
# and uploads it to TestFlight. The notarized Developer-ID build for direct
# downloads lives in release-github.yml.

on:
  workflow_dispatch:

concurrency:
  group: release-mac-appstore
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.47.5

defaults:
  run:
    working-directory: app

jobs:
  release:
    name: Build, sign & upload .pkg
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: app
      - name: Checkout quran_library (path dependency ../quran_library)
        uses: actions/checkout@v4
        with:
          repository: alheekmahlib/quran_library
          path: quran_library
      - name: Validate required secrets
        env:
          DOTENV_BASE64: ${{ secrets.DOTENV_BASE64 }}
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          MAS_INSTALLER_P12_BASE64: ${{ secrets.MAS_INSTALLER_P12_BASE64 }}
          MAS_INSTALLER_P12_PASSWORD: ${{ secrets.MAS_INSTALLER_P12_PASSWORD }}
          MAS_PROFILE_BASE64: ${{ secrets.MAS_PROFILE_BASE64 }}
          MAS_PROFILE_WIDGET_BASE64: ${{ secrets.MAS_PROFILE_WIDGET_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          miss=0
          need() { if [ -z "${!1}" ]; then echo "::error::Missing GitHub secret: $1"; miss=1; fi; }
          need DOTENV_BASE64
          need IOS_P12_BASE64
          need IOS_P12_PASSWORD
          need MAS_INSTALLER_P12_BASE64
          need MAS_INSTALLER_P12_PASSWORD
          need MAS_PROFILE_BASE64
          need MAS_PROFILE_WIDGET_BASE64
          need ASC_KEY_ID
          need ASC_ISSUER_ID
          need ASC_KEY_P8_BASE64
          [ "$miss" -eq 1 ] && exit 1
          echo "All required secrets are present"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          cache: true
      - name: Import distribution certificate (shared with iOS)
        uses: Apple-Actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.IOS_P12_BASE64 }}
          p12-password: ${{ secrets.IOS_P12_PASSWORD }}
      - name: Import Mac Installer certificate into login keychain
        env:
          MAS_INSTALLER_P12_BASE64: ${{ secrets.MAS_INSTALLER_P12_BASE64 }}
          MAS_INSTALLER_P12_PASSWORD: ${{ secrets.MAS_INSTALLER_P12_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$MAS_INSTALLER_P12_BASE64" | tr -d ' \r\n\t' | base64 --decode > "$RUNNER_TEMP/installer.p12"
          security import "$RUNNER_TEMP/installer.p12" \
            -k "$HOME/Library/Keychains/login.keychain-db" \
            -P "$MAS_INSTALLER_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild
      - name: Install Mac App Store profiles (app + widget)
        env:
          MAS_PROFILE_BASE64: ${{ secrets.MAS_PROFILE_BASE64 }}
          MAS_PROFILE_WIDGET_BASE64: ${{ secrets.MAS_PROFILE_WIDGET_BASE64 }}
        run: |
          PROFILES="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES"
          if ! printf '%s' "$MAS_PROFILE_BASE64" | tr -d ' \r\n\t' | base64 --decode > "$PROFILES/mas-app.mobileprovision" 2>/dev/null; then
            echo "::error::MAS_PROFILE_BASE64 is not valid base64 (Mac App Store profile for com.alheekmah.alquranalkareem.alquranalkareem2)"
            exit 1
          fi
          if ! printf '%s' "$MAS_PROFILE_WIDGET_BASE64" | tr -d ' \r\n\t' | base64 --decode > "$PROFILES/mas-widget.mobileprovision" 2>/dev/null; then
            echo "::error::MAS_PROFILE_WIDGET_BASE64 is not valid base64 (profile for ...alquranalkareem2.quran-macos-widget)"
            exit 1
          fi
      - name: Restore .env (bundled asset)
        env:
          DOTENV_BASE64: ${{ secrets.DOTENV_BASE64 }}
        run: printf '%s' "$DOTENV_BASE64" | base64 --decode > .env
      - name: Disable Swift Package Manager (project is not migrated; matches local behavior)
        run: flutter config --no-enable-swift-package-manager
      - run: flutter pub get
      - name: Patch project for unsigned (ad-hoc) build
        run: |
          python3 - <<'PY'
          import re
          path = "macos/Runner.xcodeproj/project.pbxproj"
          src = open(path).read()
          src = src.replace("ProvisioningStyle = Automatic;", "ProvisioningStyle = Manual;")
          strip = re.compile(r'^\t*(CODE_SIGN_STYLE|PROVISIONING_PROFILE(_SPECIFIER)?|CODE_SIGN_IDENTITY(\[[^\]]*\])?|DEVELOPMENT_TEAM)\s*=.*?;\n', re.M)
          blocks = re.compile(r'(buildSettings = \{)(.*?)(\n\t\t\t\};)', re.S)
          def patch(m):
              body = m.group(2)
              if 'PRODUCT_BUNDLE_IDENTIFIER' not in body:
                  return m.group(0)
              body = strip.sub('', body)
              inj = ('\n\t\t\t\tCODE_SIGN_STYLE = Manual;'
                     '\n\t\t\t\tCODE_SIGN_IDENTITY = "-";')
              return m.group(1) + body + inj + m.group(3)
          open(path, 'w').write(blocks.sub(patch, src))
          print("macOS project patched for ad-hoc signing")
          PY
      - run: flutter build macos --release
      - name: Sign for Mac App Store & package .pkg
        run: |
          set -euo pipefail
          APP="build/macos/Build/Products/Release/alquranalkareem.app"
          PROFILES="$HOME/Library/MobileDevice/Provisioning Profiles"
          IDENT_APP=$(security find-identity -v -p codesigning | grep "Apple Distribution" | head -1 | sed -E 's/^.*"(.*)".*$/\1/')
          IDENT_INST=$(security find-identity -v -p codesigning | grep "3rd Party Mac Developer Installer" | head -1 | sed -E 's/^.*"(.*)".*$/\1/')
          if [ -z "$IDENT_APP" ]; then
            echo "::error::No 'Apple Distribution' identity found — IOS_P12 must be an Apple Distribution cert (covers iOS + macOS)"
            exit 1
          fi
          if [ -z "$IDENT_INST" ]; then
            echo "::error::No '3rd Party Mac Developer Installer' identity found in MAS_INSTALLER_P12_BASE64"
            exit 1
          fi
          echo "Signing app with: $IDENT_APP"
          echo "Signing pkg with:  $IDENT_INST"
          # Embed App Store provisioning profiles (required for MAS)
          cp "$PROFILES/mas-app.mobileprovision" "$APP/Contents/embedded.provisionprofile"
          find "$APP/Contents/PlugIns" -type d -name "*.appex" 2>/dev/null | while IFS= read -r ex; do
            cp "$PROFILES/mas-widget.mobileprovision" "$ex/Contents/embedded.provisionprofile"
          done
          # Sign deepest-first; MAS builds use no hardened runtime / no timestamp
          find "$APP" -type f -name "*.dylib" | awk -F/ '{print NF, $0}' | sort -rn | cut -d' ' -f2- \
            | while IFS= read -r f; do codesign --force --sign "$IDENT_APP" "$f"; done
          find "$APP" -type d -name "*.framework" | awk -F/ '{print NF, $0}' | sort -rn | cut -d' ' -f2- \
            | while IFS= read -r f; do codesign --force --sign "$IDENT_APP" "$f"; done
          find "$APP" -type d -name "*.appex" \
            | while IFS= read -r f; do codesign --force --sign "$IDENT_APP" --entitlements macos/quran_macos_widgetExtension.entitlements "$f"; done
          codesign --force --sign "$IDENT_APP" --entitlements macos/Runner/Release.entitlements "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          productbuild --component "$APP" /Applications --sign "$IDENT_INST" alquranalkareem-macos-appstore.pkg
      - uses: actions/upload-artifact@v4
        with:
          name: macos-appstore
          if-no-files-found: error
          path: app/alquranalkareem-macos-appstore.pkg
      - name: Install fastlane
        run: sudo gem install fastlane --no-document
      - name: Write App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          printf '%s' "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          jq -n --arg key_id "$ASC_KEY_ID" --arg issuer_id "$ASC_ISSUER_ID" \
            --rawfile key "$RUNNER_TEMP/AuthKey.p8" \
            '{key_id: $key_id, issuer_id: $issuer_id, key: $key}' > "$RUNNER_TEMP/asc.json"
      - name: Upload .pkg to TestFlight
        run: |
          fastlane pilot upload \
            --api_key_path "$RUNNER_TEMP/asc.json" \
            --pkg alquranalkareem-macos-appstore.pkg \
            --skip_waiting_for_build_processing
          echo "pkg delivered to TestFlight — submit the Mac App Store version manually after review."
